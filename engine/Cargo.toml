[package]
name = "sorter-engine"
version = "0.1.0"
edition = "2021"
description = "Applies plans to the file system, with an append-only log and undo."

[dependencies]
sorter-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = { version = "1", default-features = false, features = ["pure", "std"] }
imagesize = "0.13"
toml_edit = "0.22"
