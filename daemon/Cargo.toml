[package]
name = "wallpaper-sorter"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Watches your wallpaper folders and sorts new images into place."

[lib]
name = "sorter_daemon"
path = "src/lib.rs"

[[bin]]
name = "wallpaper-sorter"
path = "src/main.rs"

[dependencies]
sorter-core = { path = "../core" }
sorter-engine = { path = "../engine" }
inotify = { version = "0.10", default-features = false }
libc = "0.2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
httpdate = "1"
base64 = "0.22"
blake3 = "1"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
