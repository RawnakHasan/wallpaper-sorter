<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallpaper Sorter</title>

    <!-- Favicons -->
    <link
      rel="icon"
      href="/icons/favicon.svg"
      type="image/svg+xml"
      sizes="any"
    />
    <link
      rel="icon"
      href="/icons/favicon-48.svg"
      type="image/svg+xml"
      sizes="48x48"
    />
    <link
      rel="icon"
      href="/icons/favicon-32.svg"
      type="image/svg+xml"
      sizes="32x32"
    />
    <link
      rel="icon"
      href="/icons/favicon-16.svg"
      type="image/svg+xml"
      sizes="16x16"
    />

    <!-- Browser UI colour -->
    <meta
      name="theme-color"
      content="#121314"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#fafafa"
      media="(prefers-color-scheme: light)"
    />

    <!-- iOS home screen (PNG only, see below) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" crossorigin src="/assets/app.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app.css">
  </head>
  <body>
    <div id="app"></div>
    <noscript>This page needs JavaScript.</noscript>
  </body>
</html>
