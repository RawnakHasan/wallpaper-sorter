.dk{--bg:#121314;--sf:#18191b;--rs:#1e2023;--hv:#26282c;--bd:#2c2e33;--tx:#e8e9ea;--t2:#a8acb1;--t3:#8a8f95;--ac:#6aa6ff;--oa:#0b1220;--sel:rgba(106,166,255,.16);--wn:#e0a458;--er:#ef7d75;--sk:#26282c;--sk2:#30333a;--dur:150ms;--ease:cubic-bezier(.2,0,0,1)}
.lt{--bg:#fafafa;--sf:#f3f4f5;--rs:#ffffff;--hv:#ebedef;--bd:#dfe1e4;--tx:#17181a;--t2:#4b5057;--t3:#626870;--ac:#1d5fd1;--oa:#ffffff;--sel:rgba(29,95,209,.10);--wn:#9a5b00;--er:#b3261e;--sk:#eceef0;--sk2:#dcdfe3;--dur:150ms;--ease:cubic-bezier(.2,0,0,1)}
.dk,.lt{background:var(--bg);color:var(--tx);font:400 14px/1.45 'Hanken Grotesk',sans-serif}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#121314}
#app{height:100vh;height:100dvh}
.a-app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);color:var(--tx);font:400 14px/1.45 'Hanken Grotesk',sans-serif}
.a-app button{font:inherit;color:inherit}
.a-tb{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid var(--bd);flex:none}
.a-brandm{font-weight:600;white-space:nowrap}
.a-in{font:400 14px 'Hanken Grotesk',sans-serif;height:32px;width:100%;max-width:420px;min-width:0;padding:0 10px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--tx)}
.a-in::placeholder{color:var(--t3)}
.a-btn{font:500 14px 'Hanken Grotesk',sans-serif;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;white-space:nowrap;transition:background var(--dur) var(--ease)}
.a-btn:hover{background:var(--hv)}
.a-btn.p{background:var(--ac);border-color:var(--ac);color:var(--oa)}
.a-btn.p:hover{background:var(--ac);filter:brightness(1.1)}
.a-chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--bd);background:transparent;cursor:pointer;font-size:14px;white-space:nowrap}
.a-chip:hover{background:var(--hv)}
.a-dot{width:6px;height:6px;border-radius:50%;background:var(--t2)}
.a-dot.s1{background:var(--wn)}.a-dot.s2{background:var(--er)}
.a-app button:focus-visible,.a-in:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.a-bd{display:flex;flex:1;min-height:0}
.a-rail{width:168px;flex:none;background:var(--sf);border-right:1px solid var(--bd);padding:16px 0;display:flex;flex-direction:column;gap:2px;overflow:auto}
.a-brand{padding:0 20px 16px;font-weight:600}
.a-nv{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 12px;margin:0 8px;border-radius:6px;color:var(--t2);font-size:14px;cursor:pointer}
.a-nv:hover{background:var(--hv)}
.a-nv.on{background:var(--sel);color:var(--ac)}
.a-nv:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.a-m{font-family:'JetBrains Mono',monospace;font-size:12px}
.a-grp{padding:20px 20px 4px;font-size:12px;color:var(--t3)}
.a-th{margin-top:auto;padding:16px 8px 0;display:flex;flex-direction:column;gap:6px}
.a-grp0{font-size:12px;color:var(--t3);padding:0 4px}
.a-sg{display:flex;border:1px solid var(--bd);border-radius:6px;padding:2px;gap:2px}
.a-sg button{all:unset;cursor:pointer;flex:1;text-align:center;height:24px;line-height:24px;border-radius:4px;font-size:12px;color:var(--t2)}
.a-sg button.on{background:var(--sel);color:var(--ac)}
.a-sg button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.a-stage{flex:1;min-width:0;position:relative}
.a-bb{display:flex;border-top:1px solid var(--bd);background:var(--sf);height:56px;flex:none}
.a-bb .a-nv{flex:1;margin:0;border-radius:0;justify-content:center;gap:6px;font-size:12px}
.a-more{position:absolute;left:0;right:0;bottom:56px;z-index:30;background:var(--rs);border-top:1px solid var(--bd);padding:8px;display:flex;flex-direction:column}
.a-mi{all:unset;box-sizing:border-box;height:40px;padding:0 12px;border-radius:6px;display:flex;align-items:center;color:var(--t2);cursor:pointer}
.a-mi:hover{background:var(--hv)}
.a-mi.on{background:var(--sel);color:var(--ac)}
.a-more .a-th{margin-top:8px;padding:8px 4px 4px;border-top:1px solid var(--bd)}
.a-sn{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--bd);background:var(--rs);max-width:92%;z-index:40;animation:a-up var(--dur) var(--ease)}
.a-bb ~ .a-sn{bottom:76px}
@keyframes a-up{from{opacity:0;transform:translate(-50%,8px)}}
.page{position:absolute;inset:0;display:none;overflow:hidden}
.page.on{display:flex}
.page.scroll.on{display:block;overflow:auto}
@media (prefers-reduced-motion:reduce){.a-sn{animation:none}.a-btn{transition:none}}

"s9": { scroll: false, tpl: "<main class=\"mn\">\n<div class=\"hd\"><h1 class=\"h1\">Settings<\/h1><\/div>\n<nav class=\"ix\" aria-label=\"Sections\"><a href=\"#s-watch\">Watched folders<\/a><a href=\"#s-types\">Image types<\/a><a href=\"#s-dups\">Duplicates<\/a><a href=\"#s-num\">Numbering<\/a><a href=\"#s-notif\">Notifications<\/a><a href=\"#s-thumb\">Thumbnails<\/a><a href=\"#s-data\">Data<\/a><a href=\"#s-server\">Server<\/a><a href=\"#s-look\">Appearance<\/a><a href=\"#s-about\">About<\/a><\/nav>\n\n<section class=\"sec\" id=\"s-watch\">\n<div class=\"sh\"><h2 class=\"h2\">Watched folders<\/h2><p class=\"s\">New images in these folders are sorted into the library.<\/p><\/div>\n<div class=\"ctl\">\n<sc-for list=\"{{ folders }}\" as=\"f\" hint-placeholder-count=\"2\"><div class=\"rw\">\n<div class=\"fx\"><code style=\"word-break:break-all\">{{ f.path }}<\/code><span class=\"s\">{{ f.scope }}<\/span><\/div>\n<span class=\"st\"><span class=\"dot {{ f.dotCls }}\"><\/span>{{ f.status }}<\/span>\n<button class=\"sv\" role=\"switch\" aria-checked=\"{{ f.on }}\" aria-label=\"Watch this folder\" onClick=\"{{ f.toggle }}\"><\/button>\n<sc-if value=\"{{ f.removable }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"b q d\" onClick=\"{{ f.remove }}\">Remove<\/button><\/sc-if>\n<sc-if value=\"{{ f.fixed }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"s\" style=\"min-width:64px;text-align:right\">Library<\/span><\/sc-if>\n<\/div><\/sc-for>\n<sc-if value=\"{{ addOpen }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"addf\">\n<input class=\"in mo {{ pathBad }}\" placeholder=\"~/Pictures/More\" aria-label=\"Folder path\" value=\"{{ addPath }}\" onChange=\"{{ setAddPath }}\">\n<div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\"><div class=\"sg\" role=\"group\" aria-label=\"Scope\"><sc-for list=\"{{ scopeOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button class=\"{{ o.cls }}\" onClick=\"{{ o.go }}\">{{ o.lbl }}<\/button><\/sc-for><\/div><span style=\"flex:1\"><\/span><button class=\"b q\" onClick=\"{{ closeAdd }}\">Cancel<\/button><button class=\"b p\" disabled=\"{{ addOff }}\" onClick=\"{{ doAdd }}\">Add folder<\/button><\/div>\n<sc-if value=\"{{ pathErr }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"er\">{{ pathErr }}<\/span><\/sc-if>\n<\/div><\/sc-if>\n<sc-if value=\"{{ addClosed }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"padding-top:12px\"><button class=\"b\" onClick=\"{{ openAdd }}\">Add folder<\/button><\/div><\/sc-if>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-types\">\n<div class=\"sh\"><h2 class=\"h2\">Image types<\/h2><p class=\"s\">Only files with these extensions are sorted.<\/p><\/div>\n<div class=\"ctl\">\n<div class=\"chs\"><sc-for list=\"{{ types }}\" as=\"t\" hint-placeholder-count=\"6\"><button class=\"ch {{ t.cls }}\" aria-pressed=\"{{ t.on }}\" onClick=\"{{ t.go }}\">.{{ t.ext }}<\/button><\/sc-for><\/div>\n<div class=\"rw\" style=\"border-top:1px solid var(--bd)\"><span class=\"t2\" style=\"width:56px\">Video<\/span><button class=\"ch\" disabled>.mp4<\/button><button class=\"ch\" disabled>.webm<\/button><span class=\"s\">Coming later<\/span><\/div>\n<div class=\"rw\" style=\"border-bottom:0\"><div style=\"width:120px\"><input class=\"in mo {{ neBad }}\" placeholder=\"avif\" aria-label=\"New extension\" value=\"{{ ne }}\" onChange=\"{{ setNe }}\"><\/div><button class=\"b\" disabled=\"{{ neOff }}\" onClick=\"{{ addExt }}\">Add type<\/button><sc-if value=\"{{ neErr }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"er\">{{ neErr }}<\/span><\/sc-if><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-dups\">\n<div class=\"sh\"><h2 class=\"h2\">Duplicates folder<\/h2><p class=\"s\">Exact copies are moved here. Nothing is deleted automatically.<\/p><\/div>\n<div class=\"ctl\">\n<div class=\"rw\" style=\"border-bottom:0\"><div style=\"width:240px\"><input class=\"in mo {{ dupBad }}\" aria-label=\"Duplicates folder name\" value=\"{{ dupVal }}\" onChange=\"{{ setDup }}\"><\/div><button class=\"b\" disabled=\"{{ dupOff }}\" onClick=\"{{ saveDup }}\">Save<\/button><sc-if value=\"{{ dupErr }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"er\">{{ dupErr }}<\/span><\/sc-if><\/div>\n<span class=\"s\">The folder is created inside the library. Renaming moves its files.<\/span>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-num\">\n<div class=\"sh\"><h2 class=\"h2\">Numbering<\/h2><p class=\"s\">Files are named Prefix number. The next number is the highest plus one. Choose what happens to gaps.<\/p><\/div>\n<div class=\"ctl\">\n<sc-for list=\"{{ gapOpts }}\" as=\"g\" hint-placeholder-count=\"4\"><button class=\"rad {{ g.cls }}\" role=\"radio\" aria-checked=\"{{ g.on }}\" onClick=\"{{ g.go }}\"><span class=\"rd\"><\/span><span class=\"fx\"><span style=\"font-weight:500\">{{ g.title }}<\/span><span class=\"s\">{{ g.desc }}<\/span><\/span><\/button><\/sc-for>\n<div class=\"pv\"><span class=\"s\">Example: Chisa has 19 images, numbered 1 to 21, with 5 and 11 missing.<\/span><code>{{ gapPreview }}<\/code><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-notif\">\n<div class=\"sh\"><h2 class=\"h2\">Notifications<\/h2><\/div>\n<div class=\"ctl\"><p class=\"t2\" style=\"max-width:520px\">In-app only. The waiting count appears on Inbox in the navigation and in the Inbox sidebar. There are no desktop pop-ups.<\/p><\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-thumb\">\n<div class=\"sh\"><h2 class=\"h2\">Thumbnails<\/h2><p class=\"s\">Made on demand and kept in a cache.<\/p><\/div>\n<div class=\"ctl\">\n<div class=\"rw\"><div class=\"fx\"><span><span class=\"m\">{{ usedTxt }}<\/span> <span class=\"t2\">used of<\/span> <span class=\"m\">{{ capTxt }}<\/span><\/span><div class=\"pb\" style=\"margin-top:8px\" role=\"progressbar\" aria-label=\"Cache used\"><i style=\"{{ usedBar }}\"><\/i><\/div><\/div><button class=\"b\" disabled=\"{{ clearOff }}\" onClick=\"{{ clearCache }}\">Clear cache<\/button><\/div>\n<div class=\"rw\" style=\"border-bottom:0\"><span class=\"t2\" style=\"width:120px\">Cache cap, MB<\/span><div style=\"width:96px\"><input class=\"in mo {{ capBad }}\" aria-label=\"Cache cap in MB\" value=\"{{ capVal }}\" onChange=\"{{ setCap }}\"><\/div><button class=\"b\" disabled=\"{{ capOff }}\" onClick=\"{{ saveCap }}\">Save<\/button><sc-if value=\"{{ capErr }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"er\">{{ capErr }}<\/span><\/sc-if><\/div>\n<span class=\"s\">At the cap, the least recently used thumbnails are removed first.<\/span>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-data\">\n<div class=\"sh\"><h2 class=\"h2\">Data<\/h2><p class=\"s\">Origin records are permanent. The activity log keeps recent entries only.<\/p><\/div>\n<div class=\"ctl\">\n<div class=\"kv\"><span class=\"t2\">Origin records<\/span><div style=\"display:flex;flex-direction:column;gap:2px\"><code style=\"word-break:break-all\">~/Pictures/Wallpapers/.sorter/<\/code><span class=\"s\">379 records, 0.2 MB<\/span><\/div><\/div>\n<div class=\"rw\" style=\"border-top:1px solid var(--bd)\"><div class=\"fx\"><span class=\"t2\">Log size cap<\/span><span class=\"s\">1,842 entries now. Oldest entries are dropped first.<\/span><\/div><div class=\"sg\" role=\"group\" aria-label=\"Log size cap\"><sc-for list=\"{{ logOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{ o.cls }}\" onClick=\"{{ o.go }}\">{{ o.lbl }}<\/button><\/sc-for><\/div><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-server\">\n<div class=\"sh\"><h2 class=\"h2\">Server<\/h2><p class=\"s\">The web page is served from this computer only.<\/p><\/div>\n<div class=\"ctl\">\n<div class=\"kv\"><span class=\"t2\">Access<\/span><span>Localhost only. Other devices cannot connect.<\/span><\/div>\n<div class=\"rw\" style=\"border-top:1px solid var(--bd)\"><span class=\"t2\" style=\"width:120px\">Port<\/span><div style=\"width:96px\"><input class=\"in mo {{ portBad }}\" aria-label=\"Port\" value=\"{{ portVal }}\" onChange=\"{{ setPort }}\"><\/div><button class=\"b\" disabled=\"{{ portOff }}\" onClick=\"{{ savePort }}\">Save<\/button><sc-if value=\"{{ portErr }}\" hint-placeholder-val=\"{{ false }}\"><span class=\"er\">{{ portErr }}<\/span><\/sc-if><\/div>\n<span class=\"s\">Address <code>{{ addr }}<\/code>. A port change needs a server restart.<\/span>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-look\">\n<div class=\"sh\"><h2 class=\"h2\">Appearance<\/h2><\/div>\n<div class=\"ctl\">\n<div class=\"rw\"><span class=\"t2\" style=\"width:120px\">Theme<\/span><div class=\"sg\" role=\"group\" aria-label=\"Theme mode\"><sc-for list=\"{{ modeOpts }}\" as=\"o\" hint-placeholder-count=\"3\"><button class=\"{{ o.cls }}\" onClick=\"{{ o.go }}\">{{ o.lbl }}<\/button><\/sc-for><\/div><\/div>\n<div class=\"rw\"><span class=\"t2\" style=\"width:120px\">Accent<\/span><div style=\"display:flex;gap:4px\"><sc-for list=\"{{ accents }}\" as=\"a\" hint-placeholder-count=\"4\"><button class=\"acb {{ a.cls }}\" aria-label=\"{{ a.lbl }}\" aria-pressed=\"{{ a.on }}\" onClick=\"{{ a.go }}\"><i style=\"{{ a.fill }}\"><\/i><\/button><\/sc-for><\/div><\/div>\n<div class=\"rw\"><span class=\"t2\" style=\"width:120px\">Density<\/span><div class=\"sg\" role=\"group\" aria-label=\"Density\"><sc-for list=\"{{ densOpts }}\" as=\"o\" hint-placeholder-count=\"2\"><button class=\"{{ o.cls }}\" onClick=\"{{ o.go }}\">{{ o.lbl }}<\/button><\/sc-for><\/div><\/div>\n<\/div>\n<\/section>\n\n<section class=\"sec\" id=\"s-about\">\n<div class=\"sh\"><h2 class=\"h2\">About<\/h2><\/div>\n<div class=\"ctl\">\n<div class=\"kv\"><span class=\"t2\">Version<\/span><code>0.1.0<\/code><\/div>\n<div class=\"kv\" style=\"border-top:1px solid var(--bd)\"><span class=\"t2\">Uptime<\/span><code>3 days 4 hours<\/code><\/div>\n<\/div>\n<\/section>\n<\/main>\n\n<sc-if value=\"{{ hasSnack }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sn\" role=\"status\"><span>{{ snackMsg }}<\/span><sc-if value=\"{{ snackUndo }}\" hint-placeholder-val=\"{{ true }}\"><button class=\"b\" onClick=\"{{ doUndo }}\">Undo<\/button><\/sc-if><\/div><\/sc-if>\n", make() {

class Component extends DCLogic {
state = {
  vp: 'desk', used: 412, dd: null, cd: null, pd: null, ne: '', add: null, sn: null,
  cfg: {
    mode: 'dark', accent: 'blue', dens: 'comfortable', gap: 'keep', dupName: 'Duplicates', cap: 1024, logCap: 5000, port: 4747,
    folders: [
      { id: 'lib', path: '~/Pictures/Wallpapers', scope: 'Top level only', on: true, fixed: true },
      { id: 'pix', path: '~/Downloads/pixiv/', scope: 'Includes subfolders', on: true }
    ],
    types: ['jpg', 'jpeg', 'png', 'webp', 'gif', 'bmp'].map((ext) => ({ ext, on: true }))
  }
};
toast(msg, undo) { clearTimeout(this._t); this.setState({ sn: { msg, undo } }); this._t = setTimeout(() => this.setState({ sn: null }), 5000); }
renderVals() {
  const s = this.state; if (this._seen !== window.App.mode) s.cfg = { ...s.cfg, mode: window.App.mode }; this._seen = window.App.mode; const c = s.cfg, isMob = s.vp === 'mob', th = window.App.resolve(c.mode), lt = th === 'lt';
  const set = (patch, msg) => { const prev = s.cfg; this.setState({ cfg: { ...prev, ...patch } }); this.toast(msg, () => this.setState({ cfg: prev })); };
  const opts = (arr, cur, fn) => arr.map(([v, l]) => ({ lbl: l, cls: cur === v ? 'on' : '', go: () => fn(v) }));
  const ACC = { blue: ['Blue', '#6aa6ff', '106,166,255', '#1d5fd1', '29,95,209'], teal: ['Teal', '#4fc3b5', '79,195,181', '#0f766e', '15,118,110'], violet: ['Violet', '#a99bff', '169,155,255', '#5b45d6', '91,69,214'], green: ['Green', '#6cc58b', '108,197,139', '#1f7a45', '31,122,69'] };
  const av = ACC[c.accent];
  const accVars = '--ac:' + (lt ? av[3] : av[1]) + ';--sel:rgba(' + (lt ? av[4] + ',.10' : av[2] + ',.16') + ')';
  const size = { desk: [1440, 880], tab: [834, 880], mob: [390, 800] }[s.vp];

  // watched folders
  const folders = c.folders.map((f) => ({
    path: f.path, scope: f.scope, on: f.on, fixed: !!f.fixed, removable: !f.fixed, status: f.on ? 'Watching' : 'Paused', dotCls: f.on ? 'on' : '',
    toggle: () => set({ folders: c.folders.map((x) => (x.id === f.id ? { ...x, on: !x.on } : x)) }, (f.on ? 'Paused ' : 'Resumed ') + f.path),
    remove: () => set({ folders: c.folders.filter((x) => x.id !== f.id) }, 'Removed ' + f.path)
  }));
  const nOn = c.folders.filter((f) => f.on).length;
  const ad = s.add, addPathV = ad ? ad.path : '', p = addPathV.trim();
  const pathOk = /^(~\/|\/)\S.*$/.test(p) && !c.folders.some((f) => f.path.replace(/\/$/, '') === p.replace(/\/$/, ''));
  const pathErr = p && !pathOk ? (/^(~\/|\/)\S.*$/.test(p) ? 'Already watched' : 'Enter a full path, such as ~/Pictures/More') : '';
  const scopeOpts = opts([['top', 'Top level only'], ['sub', 'Includes subfolders']], ad ? ad.scope : 'top', (v) => this.setState({ add: { ...s.add, scope: v } }));

  // image types
  const types = c.types.map((t) => ({ ext: t.ext, on: t.on, cls: t.on ? 'on' : '', go: () => set({ types: c.types.map((x) => (x.ext === t.ext ? { ...x, on: !x.on } : x)) }, (t.on ? 'Ignoring .' : 'Sorting .') + t.ext + ' files') }));
  const ne = s.ne.trim().toLowerCase().replace(/^\./, '');
  const neOk = /^[a-z0-9]{2,5}$/.test(ne) && !c.types.some((x) => x.ext === ne);
  const neErr = ne && !neOk ? (c.types.some((x) => x.ext === ne) ? 'Already in the list' : 'Use 2 to 5 letters or digits') : '';

  // duplicates folder
  const dupVal = s.dd !== null ? s.dd : c.dupName, dupT = dupVal.trim();
  const dupErr = !dupT ? 'Enter a name' : /[\/\\]/.test(dupT) ? 'No slashes in the name' : '';

  // numbering
  const GAP = [
    ['keep', 'Keep gaps', 'The next file takes the highest number plus one. Gaps stay as they are.', 'Next file: Chisa 22.png'],
    ['lowest', 'Next file takes the lowest free number', 'The next incoming file fills the first gap.', 'Next file: Chisa 5.png'],
    ['last', 'Rename the last image into the gap', 'The highest-numbered file moves into the lowest gap.', 'Chisa 21.png becomes Chisa 5.png and Chisa 20.png becomes Chisa 11.png. Next file: Chisa 20.png'],
    ['full', 'Full renumber', 'The whole folder is renumbered 1 to N when a file arrives. Renames many files and is logged as one batch.', '15 files renamed, Chisa 1 to Chisa 19. Next file: Chisa 20.png']
  ];
  const gapOpts = GAP.map(([k, title, desc]) => ({ title, desc, on: c.gap === k, cls: c.gap === k ? 'on' : '', go: () => set({ gap: k }, 'Numbering: ' + title.toLowerCase()) }));

  // thumbnails
  const cv = s.cd !== null ? s.cd : String(c.cap), capN = parseInt(cv, 10);
  const capOk = /^\d+$/.test(cv) && capN >= 100 && capN <= 10240;
  const pct = Math.min(100, Math.round((s.used / c.cap) * 100));

  // server
  const pv = s.pd !== null ? s.pd : String(c.port), portN = parseInt(pv, 10);
  const portOk = /^\d+$/.test(pv) && portN >= 1024 && portN <= 65535;

  const mode = (m, l) => set({ mode: m }, 'Theme: ' + l);
  return {
    th, accVars, fmCls: (isMob ? 'mb' : '') + (s.vp === 'tab' ? ' tab' : '') + (c.dens === 'compact' ? ' cp' : ''), frameStyle: 'width:' + size[0] + 'px;height:' + size[1] + 'px',
    vpOpts: opts([['desk', 'Desktop 1440'], ['tab', 'Tablet 834'], ['mob', 'Mobile 390']], s.vp, (v) => this.setState({ vp: v })),
    thOpts: opts([['dk', 'Dark'], ['lt', 'Light']], th, (v) => this.setState({ cfg: { ...c, mode: v === 'lt' ? 'light' : 'dark' } })),
    notMob: !isMob, isMob, scan: () => this.toast('Scan started', null),
    chipTxt: nOn ? 'Watching ' + nOn + (nOn === 1 ? ' folder' : ' folders') : 'Paused', chipDot: nOn ? 'on' : '',
    nav: [['Overview', '/'], ['Inbox', '/inbox'], ['Library', '/library/$path'], ['Tags', '/tags'], ['Duplicates', '/duplicates'], ['Data', '/data'], ['Re-sort', '/resort'], ['Activity', '/activity'], ['Settings', '/settings']].map(([label, route]) => ({ label, route, count: label === 'Inbox', cls: label === 'Settings' ? 'on' : '' })),
    tabs: ['Overview', 'Inbox', 'Library', 'Tags', 'More'].map((label) => ({ label, cls: label === 'More' ? 'on' : '' })),
    folders, addOpen: !!ad, addClosed: !ad, addPath: addPathV, pathErr, pathBad: pathErr ? 'bad' : '', addOff: !pathOk, scopeOpts,
    setAddPath: (e) => this.setState({ add: { ...s.add, path: e.target.value } }),
    openAdd: () => this.setState({ add: { path: '', scope: 'top' } }), closeAdd: () => this.setState({ add: null }),
    doAdd: () => { set({ folders: [...c.folders, { id: 'f' + Date.now(), path: p, scope: ad.scope === 'sub' ? 'Includes subfolders' : 'Top level only', on: true }] }, 'Now watching ' + p); this.setState({ add: null }); },
    types, ne: s.ne, neErr, neBad: neErr ? 'bad' : '', neOff: !neOk,
    setNe: (e) => this.setState({ ne: e.target.value }),
    addExt: () => { set({ types: [...c.types, { ext: ne, on: true }] }, 'Added .' + ne); this.setState({ ne: '' }); },
    dupVal, dupErr, dupBad: dupErr ? 'bad' : '', dupOff: !!dupErr || dupT === c.dupName,
    setDup: (e) => this.setState({ dd: e.target.value }),
    saveDup: () => { set({ dupName: dupT }, 'Duplicates folder renamed to ' + dupT); this.setState({ dd: null }); },
    gapOpts, gapPreview: GAP.find((g) => g[0] === c.gap)[3],
    usedTxt: s.used + ' MB', capTxt: c.cap + ' MB', usedBar: 'width:' + pct + '%',
    clearOff: s.used === 0, clearCache: () => { this.setState({ used: 0 }); this.toast('Cleared ' + s.used + ' MB. Thumbnails rebuild as you browse.', null); },
    capVal: cv, capBad: cv && !capOk ? 'bad' : '', capErr: capOk ? '' : 'Enter 100 to 10240', capOff: !capOk || capN === c.cap,
    setCap: (e) => this.setState({ cd: e.target.value }),
    saveCap: () => { set({ cap: capN }, 'Thumbnail cap set to ' + capN + ' MB'); this.setState({ cd: null }); },
    logOpts: opts([[1000, '1,000'], [5000, '5,000'], [10000, '10,000']], c.logCap, (v) => set({ logCap: v }, 'Log keeps ' + v.toLocaleString('en-US') + ' entries')),
    portVal: pv, portBad: pv && !portOk ? 'bad' : '', portErr: portOk ? '' : 'Use 1024 to 65535', portOff: !portOk || portN === c.port, addr: 'http://127.0.0.1:' + c.port,
    setPort: (e) => this.setState({ pd: e.target.value }),
    savePort: () => { set({ port: portN }, 'Port set to ' + portN + '. Restart the server to apply.'); this.setState({ pd: null }); },
    modeOpts: opts([['dark', 'Dark'], ['light', 'Light'], ['system', 'System']], c.mode, (v) => mode(v, v[0].toUpperCase() + v.slice(1))),
    accents: Object.keys(ACC).map((k) => ({ lbl: ACC[k][0], on: c.accent === k, cls: c.accent === k ? 'on' : '', fill: 'background:' + (lt ? ACC[k][3] : ACC[k][1]), go: () => set({ accent: k }, 'Accent: ' + ACC[k][0].toLowerCase()) })),
    densOpts: opts([['comfortable', 'Comfortable'], ['compact', 'Compact']], c.dens, (v) => set({ dens: v }, 'Density: ' + v)),
    onKey: (e) => { if (e.key === 'Escape' && s.add) this.setState({ add: null }); },
    hasSnack: !!s.sn, snackMsg: s.sn ? s.sn.msg : '', snackUndo: !!(s.sn && s.sn.undo),
    doUndo: () => { if (s.sn && s.sn.undo) s.sn.undo(); this.setState({ sn: null }); }
  };
}
}

return Component; } },
"s10": { scroll: false, tpl: "<main class=\"mn\">\n\n<sc-if value=\"{{ isWelcome }}\" hint-placeholder-val=\"{{ false }}\"><div class=\"wl\"><div class=\"brand h2\">Wallpaper Sorter<\/div>\n<div class=\"stp\" aria-label=\"Setup steps\"><sc-for list=\"{{ steps }}\" as=\"p\" hint-placeholder-count=\"4\"><span class=\"sp {{ p.cls }}\"><span class=\"m\">{{ p.n }}<\/span> {{ p.label }}<\/span><\/sc-for><\/div>\n\n<sc-if value=\"{{ s1 }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"display:flex;flex-direction:column;gap:16px\">\n<div><h1 class=\"h1\">Choose your library folder<\/h1><p class=\"t2\" style=\"margin-top:4px\">Sorted images go into folders inside it. Only its top level is watched.<\/p><\/div>\n<div><input class=\"in mo {{ libBad }}\" aria-label=\"Library folder\" value=\"{{ lib }}\" onChange=\"{{ setLib }}\"><sc-if value=\"{{ libErr }}\" hint-placeholder-val=\"{{ false }}\"><p class=\"er\" style=\"margin-top:4px\">Enter a full path, such as ~/Pictures/Wallpapers<\/p><\/sc-if><\/div>\n<div><button class=\"b p\" disabled=\"{{ libOff }}\" onClick=\"{{ to2 }}\">Continue<\/button><\/div>\n<\/div><\/sc-if>\n\n<sc-if value=\"{{ s2 }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"display:flex;flex-direction:column;gap:16px\">\n<div><h1 class=\"h1\">Choose intake folders<\/h1><p class=\"t2\" style=\"margin-top:4px\">New images in these folders are sorted into the library.<\/p><\/div>\n<div style=\"border-top:1px solid var(--bd)\">\n<div class=\"row\"><div class=\"fx\"><code style=\"word-break:break-all\">{{ lib }}<\/code><span class=\"s\">Library. Top level only.<\/span><\/div><span class=\"s\">Always on<\/span><\/div>\n<div class=\"row\"><div class=\"fx\"><input class=\"in mo {{ pixBad }}\" aria-label=\"Pixiv folder\" value=\"{{ pix }}\" onChange=\"{{ setPix }}\"><span class=\"s\">Pixiv folder. Includes subfolders.<\/span><\/div><button class=\"sv\" role=\"switch\" aria-checked=\"{{ pixOn }}\" aria-label=\"Watch the Pixiv folder\" onClick=\"{{ togPix }}\">   for (const id in App.pages) applyPageCls(id);
  if (def.enter) def.enter(entry.inst);
  if (prevId !== def.page) { /* keep scroll positions of each page as they are */ }
  if (shell) shell.setState({ more: false });
  if (shell) shell.forceUpdate();
  document.title = 'Wallpaper Sorter';
}

const SHELL_TPL = `
<div class="a-app {{ themeCls }}" style="{{ accVars }}">
<sc-if value="{{ chrome }}"><header class="a-tb">
<sc-if value="{{ isMob }}"><span class="a-brandm">Wallpaper Sorter</span></sc-if>
<input class="a-in" placeholder="Search filename, tag, source ID" aria-label="Search">
<span style="flex:1"></span>
<sc-if value="{{ notMob }}"><button class="a-chip" onClick="{{ cycleW }}" title="Click to cycle the watcher states"><span class="a-dot {{ stCls }}"></span>{{ stLabel }}</button></sc-if>
<button class="a-btn p" onClick="{{ scan }}">Scan now</button>
</header></sc-if>
<div class="a-bd">
<sc-if value="{{ showRail }}"><nav class="a-rail" aria-label="Main"><div class="a-brand">Wallpaper Sorter</div>
<sc-for list="{{ nav }}" as="n"><button class="a-nv {{ n.cls }}" onClick="{{ n.go }}"><span>{{ n.label }}</span><sc-if value="{{ n.count }}"><span class="a-m">{{ inbox }}</span></sc-if></button></sc-for>
<div class="a-grp">Reference</div>
<sc-for list="{{ ref }}" as="n"><button class="a-nv {{ n.cls }}" onClick="{{ n.go }}"><span>{{ n.label }}</span></button></sc-for>
<div class="a-th"><span class="a-grp0">Theme</span><div class="a-sg" role="group" aria-label="Theme"><sc-for list="{{ modes }}" as="o"><button class="{{ o.cls }}" onClick="{{ o.go }}">{{ o.lbl }}</button></sc-for></div></div>
</nav></sc-if>
<div class="a-stage" data-keep></div>
</div>
<sc-if value="{{ showBb }}"><nav class="a-bb" aria-label="Main"><sc-for list="{{ tabs }}" as="t"><button class="a-nv {{ t.cls }}" onClick="{{ t.go }}">{{ t.label }}<sc-if value="{{ t.count }}"><span class="a-m">{{ inbox }}</span></sc-if></button></sc-for></nav></sc-if>
<sc-if value="{{ moreOpen }}"><div class="a-more" role="menu"><sc-for list="{{ more }}" as="n"><button class="a-mi {{ n.cls }}" onClick="{{ n.go }}">{{ n.label }}</button></sc-for>
<div class="a-th"><span class="a-grp0">Theme</span><div class="a-sg" role="group" aria-label="Theme"><sc-for list="{{ modes }}" as="o"><button class="{{ o.cls }}" onClick="{{ o.go }}">{{ o.lbl }}</button></sc-for></div></div></div></sc-if>
<sc-if value="{{ hasSnack }}"><div class="a-sn" role="status">{{ snackMsg }}</div></sc-if>
</div>`;

class Shell extends DCLogic {
  state = { sn: null, more: false };
  renderVals() {
    const A = App, s = this.state, mob = A.vp === 'mob', cur = A.route;
    const item = ([label, route, count]) => ({ label, route, count: !!count, cls: cur === route ? 'on' : '', go: () => { this.setState({ more: false }); A.go(route); } });
    const main = [['Overview', '/'], ['Inbox', '/inbox', 1], ['Library', '/library'], ['Tags', '/tags'], ['Duplicates', '/duplicates'], ['Data', '/data'], ['Re-sort', '/resort'], ['Activity', '/activity'], ['Settings', '/settings']];
    const ref = [['Design tokens', '/tokens'], ['States and motion', '/states'], ['First run', '/welcome']];
    const moreList = main.slice(4).concat(ref).map(item);
    const moreOn = moreList.some((x) => x.cls === 'on');
    const tabs = main.slice(0, 3).concat([main[3]]).map(item).concat([{ label: 'More', count: false, cls: moreOn || s.more ? 'on' : '', go: () => this.setState({ more: !s.more }) }]);
    const ST = [['Watching 2 folders', ''], ['Paused', 's1'], ['Error', 's2']][A.w];
    const chrome = cur !== '/welcome';
    const modes = [['dark', 'Dark'], ['light', 'Light'], ['system', 'System']].map(([v, l]) => ({ lbl: l, cls: A.mode === v ? 'on' : '', go: () => A.setMode(v) }));
    return {
      themeCls: A.resolve(A.mode), accVars: A.accVars, chrome, isMob: mob, notMob: !mob,
      stCls: ST[1], stLabel: ST[0], cycleW: () => A.set('w', (A.w + 1) % 3),
      scan: () => A.toast('Scan started'),
      showRail: chrome && !mob, nav: main.map(item), ref: ref.map(item), inbox: A.inbox(), modes,
      showBb: chrome && mob, tabs, moreOpen: chrome && mob && s.more, more: moreList,
      hasSnack: !!s.sn, snackMsg: s.sn || ''
    };
  }
}

const calcVp = () => (window.innerWidth < 700 ? 'mob' : window.innerWidth < 1100 ? 'tab' : 'desk');

(function boot() {
  App.vp = calcVp();
  shell = mountDC(Shell, SHELL_TPL, document.getElementById('app'), {});
  stage = document.querySelector('.a-stage');
  let raf = 0;
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => App.set('vp', calcVp())); });
  window.addEventListener('hashchange', onRoute);
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: light)'); const f = () => { if (App.mode === 'system') App.emit(); }; if (mq.addEventListener) mq.addEventListener('change', f); }
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && shell && shell.state.more) shell.setState({ more: false });
    const p = App.pages[App.activeId], f = p && p.inst.__vals && p.inst.__vals.onKey;
    if (f) f(e);
  });
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    const h = a.getAttribute('href');
    if (h === '#' || h.startsWith('#/')) return;
    e.preventDefault();
    const p = App.pages[App.activeId];
    const t = p && p.el.querySelector('[id="' + h.slice(1) + '"]');
    if (t) t.scrollIntoView({ block: 'start' });
  });
  onRoute();
})();

})();
</script>
</body>
</html>
