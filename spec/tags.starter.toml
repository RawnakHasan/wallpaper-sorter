# Wallpaper Sorter: starter tags, drafted from your folder tree.
# Edit freely; later the web UI edits this same file.
#
# Each [[tag]]:
#   keywords      words to look for in a filename (whole words, any case; several words = a phrase)
#   dest          folder inside ~/Pictures/Wallpapers (created on first use)
#   prefix        optional file prefix; default is the folder name with hyphens turned into spaces
#   match         "word" (default) or "substring"
#   strict_words  optional; the tag only applies if at least one of these words is also in the name
#   generic       optional (true/false); a generic tag only applies if no specific tag matched
#                 and the cleaned name is short (see generic_max_words)

library = "~/Pictures/Wallpapers"
setup_complete = true

# Folders whose new images are sorted into the library (the Pixiv extension's folder, for example).
[[intake]]
path = "~/Downloads/pixiv"
recursive = true              # also watch artist subfolders, including new ones
remove_empty_folders = false  # opt-in: remove an artist folder once it has been empty for a while

[settings]
image_extensions = ["jpg", "jpeg", "png", "webp", "avif", "gif", "bmp"]
duplicates_folder = "Duplicates"
generic_max_words = 4   # generic tags only apply to names with this many words or fewer
gap_mode = "keep"       # keep | lowest | last | renumber  (what to do about gaps in the numbering)

